
<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<header>
    <h1>My Store</h1>
    <input type="text" placeholder="Search products">
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
</nav>

<section class="categories">
    <h2>Categories</h2>
    <p>Electronics | Fashion | Shoes | Accessories</p>
</section>

<h2 class="heading">Our Products</h2>

<section class="products">

    <div class="card">
        <img src="https://placehold.co/200x150?text=Headphones" alt="Headphones">
        <h3>Headphones</h3>
        <p>Price: ₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://placehold.co/200x150?text=Watch" alt="Watch">
        <h3>Smart Watch</h3>
        <p>Price: ₹1499</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://placehold.co/200x150?text=Shoes" alt="Shoes">
        <h3>Shoes</h3>
        <p>Price: ₹1999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://placehold.co/200x150?text=Bag" alt="Bag">
        <h3>Travel Bag</h3>
        <p>Price: ₹799</p>
        <button>Add to Cart</button>
    </div>

</section>

<footer>
    <p>&copy; 2026 My Store. All rights reserved.</p>
</footer>

</body>
</html>
